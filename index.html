<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DEVFOLIO — портфолио для разработчиков</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
:root{--bg:#0b0b0c;--s1:#111113;--s2:#18181b;--bd:#2a2a30;--tx:#f4f4f5;--mt:#9a9aa3;--er:#f87171;--ok:#6ee7a8;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
body{background:var(--bg);color:var(--tx);font:15px/1.6 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
a{color:inherit;text-decoration:none}
.w{max-width:1120px;margin:auto;padding:0 20px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(11,11,12,.88);backdrop-filter:blur(12px);border-bottom:1px solid var(--bd)}
.nav{display:flex;align-items:center;gap:18px;height:58px}
.logo{font:500 15px "JetBrains Mono",monospace;letter-spacing:.04em}
.logo i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-right:8px}
.sp{flex:1}.nav a.l{color:var(--mt);transition:color .2s}.nav a.l:hover{color:var(--tx)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:10px 18px;border:1px solid var(--bd);border-radius:10px;background:var(--s1);color:var(--tx);font:500 14px Inter,sans-serif;cursor:pointer;transition:.2s;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn:hover{border-color:#55555e;transform:translateY(-1px)}
.btn.pri{background:var(--tx);color:#0b0b0c;border-color:var(--tx)}.btn.sm{padding:7px 14px}.btn.on{border-color:var(--tx)}.btn.dg{color:var(--er)}
.hero{padding:88px 20px 56px}
.eb{font:500 12px "JetBrains Mono",monospace;color:var(--mt);letter-spacing:.12em;text-transform:uppercase;margin-bottom:18px}
h1{font-size:clamp(36px,6vw,68px);line-height:1.04;letter-spacing:-.03em;font-weight:700;margin-bottom:20px}
h1.s{font-size:clamp(26px,4vw,38px);letter-spacing:-.02em;margin-bottom:12px}
h2{font-size:22px;letter-spacing:-.01em;margin-bottom:16px}
.lead{color:var(--mt);max-width:620px;font-size:17px;margin-bottom:22px}
.mt{color:var(--mt)}.sm{font-size:13px}.ctr{text-align:center}
.row{display:flex;flex-wrap:wrap;gap:10px;margin:16px 0}
.sec{padding-top:44px;padding-bottom:12px}.hd{display:flex;justify-content:space-between;align-items:baseline}
input,select,textarea{width:100%;background:var(--s1);color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:11px 14px;font:inherit;outline:none;transition:border-color .2s}
input:focus,select:focus,textarea:focus{border-color:#6a6a74}
.row input{flex:1;min-width:220px;width:auto}.row select{width:auto}
label{display:block;font-size:13px;color:var(--mt);margin:12px 0 5px}
.chips,.tags{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.chip{background:none;border:1px solid var(--bd);color:var(--mt);border-radius:99px;padding:5px 14px;font:inherit;font-size:13px;cursor:pointer;transition:.2s}
.chip:hover,.chip.on{color:var(--tx);border-color:var(--tx)}
.tag{font:500 12px "JetBrains Mono",monospace;color:var(--mt);background:var(--s2);border-radius:6px;padding:2px 8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}.g3{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.card,.box{background:var(--s1);border:1px solid var(--bd);border-radius:14px;overflow:hidden;transition:.25s;display:block}
.box{padding:20px}
a.card:hover,a.box:hover{transform:translateY(-3px);border-color:#4a4a52;box-shadow:0 12px 30px rgba(0,0,0,.4)}
.cover{aspect-ratio:16/10;background:#18181b center/cover}
.cover.gen{display:grid;place-items:center;background:linear-gradient(135deg,hsl(var(--h) 18% 20%),hsl(var(--h) 22% 9%))}
.cover.gen span{font:500 44px "JetBrains Mono",monospace;opacity:.5;text-transform:uppercase}
.cover.big{border-radius:14px;margin:16px 0 28px;max-height:480px;width:100%}
.cb{padding:16px}.cb h3{font-size:17px}.cb p{color:var(--mt);font-size:14px;margin:4px 0}
.by{display:flex;justify-content:space-between;color:var(--mt);font-size:13px}
.dev{display:flex;gap:14px;padding:16px;align-items:center}
.av{flex:none;width:44px;height:44px;border-radius:50%;background:var(--s2);border:1px solid var(--bd);display:grid;place-items:center;font-weight:600}.av.lg{width:72px;height:72px;font-size:26px}
.ph{display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
.pg{display:grid;grid-template-columns:1fr 300px;gap:32px;align-items:start}
@media(max-width:760px){.pg{grid-template-columns:1fr}.hero{padding-top:56px}.nav .hm{display:none}}
.pr{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--bd)}.pr b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}@media(max-width:600px){.fg{grid-template-columns:1fr}}
.full{grid-column:1/-1}
details{margin:16px 0}summary{cursor:pointer;color:var(--mt)}
footer{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;border-top:1px solid var(--bd);margin-top:64px;padding:26px 20px;color:var(--mt);font-size:13px}
#t{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--tx);color:#0b0b0c;padding:10px 18px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:.3s;z-index:40}
#t.show{opacity:1;transform:translate(-50%,0)}#t.er{background:var(--er)}
#acc{display:flex;gap:12px;align-items:center}
.ic{position:relative;font-size:17px;padding:4px 6px}.ic b{position:absolute;top:-4px;right:-4px;background:var(--tx);color:#0b0b0c;border-radius:99px;font-size:10px;line-height:1;padding:3px 5px}
.bar{height:3px;background:var(--s2);border-radius:3px;margin:6px 0 20px}.bar i{display:block;height:100%;background:var(--ok);border-radius:3px;transition:width .4s}
.pr2{display:flex;align-items:center;gap:14px;margin-bottom:10px;padding:14px 18px}.fl{flex:1;min-width:0}.dot{background:var(--tx);color:#0b0b0c;border-radius:99px;padding:1px 9px;font-size:12px;font-weight:600}
.th{display:flex;flex-direction:column;gap:8px;height:min(52vh,460px);overflow-y:auto;padding:14px;background:var(--s1);border:1px solid var(--bd);border-radius:14px;margin:14px 0}
.m{align-self:flex-start;max-width:78%;background:var(--s2);border-radius:12px;padding:8px 12px;white-space:pre-wrap;word-break:break-word}.m.me{align-self:flex-end;background:var(--tx);color:#0b0b0c}.m span{display:block;font-size:11px;opacity:.55;margin-top:2px}
.row textarea{flex:1;width:auto;min-width:220px}
#app>*{animation:in .45s both}@keyframes in{from{opacity:0;transform:translateY(10px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto}}
:root{--hb:rgba(11,11,12,.88);--l1:20%;--l2:9%}
:root[data-theme=light]{--bg:#f6f6f7;--s1:#fff;--s2:#eeeef0;--bd:#dcdce1;--tx:#0f0f11;--mt:#63636c;--hb:rgba(246,246,247,.88);--l1:90%;--l2:82%;--ok:#16a36a;--er:#dc2626;color-scheme:light}
header{background:var(--hb)}
.btn.pri,.ic b,.dot,.m.me,#t{color:var(--bg)}
.cover{background-color:var(--s2)}
.cover.gen{background:linear-gradient(135deg,hsl(var(--h) 18% var(--l1)),hsl(var(--h) 22% var(--l2)))}
.btn:hover,a.card:hover,a.box:hover{border-color:var(--mt)}
:root[data-theme=light] a.card:hover,:root[data-theme=light] a.box:hover{box-shadow:0 12px 30px rgba(0,0,0,.14)}
@media(max-width:560px){#acc .btn{max-width:90px}.nav{gap:8px}}
.pb{height:150px;border-radius:16px;border:1px solid var(--bd);background:radial-gradient(circle at 20% 30%,hsl(var(--h) 40% 30%/.55),transparent 60%),linear-gradient(135deg,hsl(var(--h) 18% var(--l1)),hsl(calc(var(--h) + 40) 22% var(--l2)))}
.pi{display:flex;align-items:flex-end;gap:18px;margin:-52px 22px 0;flex-wrap:wrap}.pi .fl{min-width:200px}.pi .row{margin:0}
.av.xl{width:104px;height:104px;font-size:40px;border:4px solid var(--bg)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:22px}
.stat{background:var(--s1);border:1px solid var(--bd);border-radius:14px;padding:14px 18px}.stat b{display:block;font-size:26px;letter-spacing:-.02em}.stat span{color:var(--mt);font-size:13px}
.pg2{display:grid;grid-template-columns:320px 1fr;gap:28px;align-items:start;margin-top:28px}
.ul{text-decoration:underline}.ok{color:var(--ok)}
label.ck{display:flex;gap:8px;align-items:center;color:var(--tx);cursor:pointer}.ck input{width:auto}
@media(max-width:860px){.pg2{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}.pi{margin:-52px 8px 0}}
.tp{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tc{border:1px solid var(--bd);border-radius:12px;padding:14px;cursor:pointer;margin:0;display:block;transition:.2s}.tc input{display:none}.tc b{display:block;color:var(--tx)}.tc span{font-size:13px}.tc:has(input:checked){border-color:var(--tx);background:var(--s2)}
@media(max-width:480px){.tp{grid-template-columns:1fr}}
.pb{position:relative}.aw{position:relative}
.ed{position:absolute;right:12px;bottom:12px;display:flex;gap:6px;align-items:center;margin:0;padding:7px 13px;border-radius:10px;background:rgba(0,0,0,.55);backdrop-filter:blur(6px);color:#fff;font-size:13px;cursor:pointer;transition:.2s}.ed:hover{background:rgba(0,0,0,.75)}
.ed2{position:absolute;right:-2px;bottom:-2px;width:34px;height:34px;margin:0;border-radius:50%;background:var(--tx);color:var(--bg);border:3px solid var(--bg);display:grid;place-items:center;cursor:pointer;font-size:14px;transition:.2s}.ed2:hover{transform:scale(1.1)}
.pb{height:190px;display:block;margin:0;border-radius:16px}
.pi{margin:-64px 24px 0;align-items:flex-end}.pi .fl{padding-bottom:6px}
.av.xl{width:124px;height:124px;font-size:46px;border:5px solid var(--bg);box-shadow:0 6px 24px rgba(0,0,0,.35)}
.pe{cursor:pointer}.aw{display:block;margin:0;border-radius:50%;line-height:0}
.ov{position:absolute;inset:0;display:grid;grid-auto-flow:column;place-content:center;gap:6px;background:rgba(0,0,0,.5);color:#fff;font:500 14px Inter,sans-serif;line-height:1.2;opacity:0;transition:.2s}
.pb .ov{border-radius:16px}.aw .ov{inset:5px;border-radius:50%;font-size:22px}
.pe:hover .ov{opacity:1}
@media(hover:none){.ov{opacity:1;background:rgba(0,0,0,.25)}}
@media(max-width:860px){.pb{height:150px}.pi{margin:-64px 8px 0}}
.rs{margin:0;cursor:pointer}.rs:has(input:checked){color:var(--tx);border-color:var(--tx)}
.st-open{color:var(--ok)}.st-progress{color:#e0a93b}.st-done{color:var(--mt)}
.demo{border:1px solid var(--bd);border-radius:14px;overflow:hidden;margin:16px 0 28px;background:#fff}.demo .hd{align-items:center;padding:10px 14px;background:var(--s1);border-bottom:1px solid var(--bd)}.demo iframe{display:block;width:100%;height:min(70vh,640px);border:0;background:#fff}
.stack{display:grid;gap:12px}
</style></head><body>
<header><div class="w nav"><a class="logo" href="#home"><i></i>DEVFOLIO</a><span class="sp"></span><a class="l hm" href="#briefs">Заказы</a><a class="l hm" href="#categories">Категории</a><a class="l hm" href="#catalog">Проекты</a><a class="l hm" href="#home" data-act="find">Разработчики</a><button class="btn sm" id="lg" data-act="lang">EN</button><button class="btn sm" id="tm" data-act="theme">☀</button><span id="acc"></span></div></header>
<main id="app"></main><div id="t" role="status"></div>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ROLES=['Frontend','Backend','Fullstack','Mobile','Data / ML','DevOps','Design'];
const LS=k=>{try{return localStorage.getItem(k)}catch{return null}},LSet=(k,v)=>{try{localStorage.setItem(k,v)}catch{}};
const S={db:null,me:null,profiles:[],stars:{},msgs:{},st:{},reg:{step:0,d:{}},ctab:'dev',cq:'',rev:{},bf:'all',lang:LS('lang')==='en'?'en':'ru',theme:LS('theme')==='light'?'light':'dark',loaded:false,q:'',tech:'',sort:'new',dq:'',role:'',edit:null,sure:null};
const mine=()=>S.me&&S.profiles.find(p=>p.id===S.me.id);
const projects=()=>S.profiles.flatMap(p=>(p.projects||[]).map(x=>({...x,owner:p})));
const sc=id=>Object.values(S.stars).filter(a=>a.includes(id)).length;
const safe=u=>/^https?:\/\//i.test(u||'')?esc(u):'';
const lnk=(u,l,c='')=>safe(u)?`<a class="btn ${c}" target="_blank" rel="noopener" href="${safe(u)}">${l} ↗</a>`:'';
const tags=a=>`<div class="tags">${(a||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>`;
const hue=s=>[...s].reduce((a,c)=>(a*31+c.charCodeAt(0))>>>0,7)%360;
const tl=s=>[...new Set(s.split(',').map(x=>x.trim()).filter(Boolean))].slice(0,10);
const cover=(p,c='')=>/^data:image\/jpeg;base64,[A-Za-z0-9+\/=]+$/.test(p.cover||'')?`<div class="cover ${c}" style="background-image:url(${p.cover})"></div>`:`<div class="cover gen ${c}" style="--h:${hue(p.title)}"><span>${esc(p.title.slice(0,2))}</span></div>`;
const card=p=>`<a class="card" href="#project-${esc(p.id)}">${cover(p)}<div class="cb"><h3>${esc(p.title)}</h3><p>${esc(p.desc.slice(0,100))}</p>${tags((p.tech||[]).slice(0,4))}<div class="by"><span>@${esc(p.owner.username)}</span><span>★ ${sc(p.id)}</span></div></div></a>`;
const devCard=p=>`<a class="card dev" href="#dev-${esc(p.username)}">${avh(p)}<div><b>${esc(p.name||p.username)}</b><div class="mt sm">@${esc(p.username)} · ${esc(p.role||'Developer')}${p.open?' · <span class="ok">Открыт к работе</span>':''}${rv(p.id).length?' · ★ '+avg(p.id):''}</div>${tags((p.skills||[]).slice(0,3))}</div></a>`;
const devs=()=>S.profiles.filter(p=>p.username&&p.type!=='client'&&(!S.role||p.role===S.role)&&(!S.dq||(p.name+' '+p.username+' '+(p.skills||[]).join(' ')).toLowerCase().includes(S.dq.toLowerCase())));
const devRes=()=>devs().map(devCard).join('')||`<p class="mt">${i18n('Никого не нашли')}</p>`;
const filt=()=>projects().filter(p=>(!S.tech||(p.tech||[]).includes(S.tech))&&(!S.q||(p.title+' '+p.desc).toLowerCase().includes(S.q.toLowerCase()))).sort(S.sort==='pop'?(a,b)=>sc(b.id)-sc(a.id):S.sort==='az'?(a,b)=>a.title.localeCompare(b.title):(a,b)=>b.created-a.created);
const catRes=()=>filt().map(card).join('')||`<p class="mt">${i18n('Ничего не найдено')}</p>`;
const nf=m=>`<section class="w sec"><div class="box ctr"><b>${m}</b><br><br><a class="btn" href="#home">На главную</a></div></section>`;
const foot='<footer><b>DEVFOLIO</b><span>Публикуйте проекты. Делитесь одной ссылкой.</span></footer>';

const heroBtns=()=>{const m=mine(),b='<a class="btn" href="#catalog">Смотреть проекты</a>';
if(!S.me)return '<a class="btn pri" href="#register">Создать профиль</a>'+b;
if(!m)return '<a class="btn pri" href="#register">Завершить регистрацию</a>'+b;
return m.type==='client'?'<a class="btn pri" href="#dashboard">Опубликовать запрос</a><a class="btn" href="#briefs">Все заказы</a>':'<a class="btn pri" href="#dashboard">Добавить проект</a><a class="btn" href="#dev-'+esc(m.username)+'">Мой профиль</a><a class="btn" href="#briefs">Заказы</a>'};
const homeV=()=>{const P=projects(),pop=[...P].sort((a,b)=>sc(b.id)-sc(a.id)||b.created-a.created).slice(0,3),rec=[...P].sort((a,b)=>b.created-a.created).slice(0,6);
return `<section class="w hero"><div class="eb">Портфолио для разработчиков</div><h1>Одна ссылка —<br>всё ваше портфолио</h1><p class="lead">Публикуйте проекты, оформляйте профиль и отправляйте работодателю страницу, которая показывает работу, а не резюме.</p><div class="row">${heroBtns()}</div><div class="mt sm">${S.profiles.filter(p=>p.username&&p.type!=='client').length} разработчиков · ${P.length} проектов</div></section>
<section class="w sec" id="find"><h2>Найти разработчика</h2><input id="dq" placeholder="Имя, username или технология" value="${esc(S.dq)}"><div id="devres" class="grid g3">${devRes()}</div></section><section class="w sec"><div class="hd"><h2>Категории разработчиков</h2><a class="mt" href="#categories">Все категории →</a></div><div class="grid g3">${ROLES.map(catCard).join('')}</div></section>
${P.length?`<section class="w sec"><h2>Популярные проекты</h2><div class="grid">${pop.map(card).join('')}</div></section><section class="w sec"><div class="hd"><h2>Недавно опубликованные</h2><a class="mt" href="#catalog">Весь каталог →</a></div><div class="grid">${rec.map(card).join('')}</div></section>`:`<section class="w sec"><div class="box ctr"><b>Пока нет проектов</b><p class="mt">Станьте первым — опубликуйте проект в личном кабинете.</p>${mine()?.type==='client'?'':'<br><a class="btn pri" href="#dashboard">Опубликовать проект</a>'}</div></section>`}
${S.me?'':`<section class="w sec"><h2>Почему DEVFOLIO</h2><div class="grid g3">${[['Показ, а не рассказ','Крупные превью, стек и живые демо вместо списка навыков.'],['Одна ссылка','Публичная страница профиля с проектами и контактами.'],['Быстрый поиск','Фильтры по технологиям, поиск по людям и проектам.']].map(x=>`<div class="box"><b>${x[0]}</b><p class="mt">${x[1]}</p></div>`).join('')}</div></section>`}`};

const catalogV=()=>{const tc={};projects().forEach(p=>(p.tech||[]).forEach(t=>tc[t]=(tc[t]||0)+1));const top=Object.keys(tc).sort((a,b)=>tc[b]-tc[a]).slice(0,14);
return `<section class="w sec"><h1 class="s">Каталог проектов</h1><div class="row"><input id="q" placeholder="Поиск по названию" value="${esc(S.q)}"><select id="sort"><option value="new">Сначала новые</option><option value="pop"${S.sort==='pop'?' selected':''}>Популярные</option><option value="az"${S.sort==='az'?' selected':''}>По алфавиту</option></select></div><div class="chips"><button class="chip${S.tech?'':' on'}" data-act="tech" data-v="">Все</button>${top.map(t=>`<button class="chip${S.tech===t?' on':''}" data-act="tech" data-v="${esc(t)}">${esc(t)}</button>`).join('')}</div><div id="res" class="grid">${catRes()}</div></section>`};

const devV=u=>{const p=S.profiles.find(x=>x.username===u);if(!p)return nf('Профиль не найден');
return `<section class="w sec"><div class="ph"><div class="av lg">${esc((p.name||u)[0].toUpperCase())}</div><div><h1 class="s">${esc(p.name||u)}</h1><div class="mt">@${esc(p.username)} · ${esc(p.role||'Developer')}</div></div><span class="sp"></span>${S.me&&p.id===S.me.id?'<a class="btn" href="#dashboard">Редактировать</a>':''}</div><p class="lead">${esc(p.bio||'')}</p>${tags(p.skills)}<div class="row">${lnk(p.github,'GitHub')}${lnk(p.site,'Сайт')}${p.email?`<a class="btn" href="mailto:${esc(p.email)}">Написать</a>`:''}${S.me&&p.id===S.me.id?'':`<a class="btn pri" href="#chat-${esc(p.username)}">Сообщение</a>`}</div></section><section class="w sec"><h2>Проекты</h2><div class="grid">${(p.projects||[]).map(x=>card({...x,owner:p})).join('')||'<p class="mt">Пока нет проектов</p>'}</div></section>`};

const MT={png:'image/png',jpg:'image/jpeg',jpeg:'image/jpeg',gif:'image/gif',webp:'image/webp',avif:'image/avif',svg:'image/svg+xml',ico:'image/x-icon',woff:'font/woff',woff2:'font/woff2',ttf:'font/ttf',otf:'font/otf',mp4:'video/mp4',webm:'video/webm',mp3:'audio/mpeg',ogg:'audio/ogg',wav:'audio/wav'};
const uri=async n=>{const e=(n||'').split('.').pop().toLowerCase();return n&&MT[e]?'data:'+MT[e]+';base64,'+await Z[n].async('base64'):null};
const rep=async(re,fn)=>{for(const m of [...html.matchAll(re)]){const r=await fn(m);if(r!=null)html=html.replace(m[0],()=>r)}};
await rep(/<link[^>]+href=["']([^"']+)["'][^>]*>/gi,async m=>{const n=find(norm(m[1]));if(!n||!/\.css$/i.test(n))return null;let css=await Z[n].async('string');const dir=n.slice(0,n.lastIndexOf('/')+1);for(const u of [...css.matchAll(/url\(["']?([^"')]+)["']?\)/gi)]){const d=await uri(find(norm(u[1],dir)));if(d)css=css.replace(u[0],()=>'url('+d+')')}return '<style>'+css+'</style>'});
await rep(/<script[^>]+src=["']([^"']+)["'][^>]*>\s*<\/script>/gi,async m=>{const n=find(norm(m[1]));return n&&/\.m?js$/i.test(n)?'<script>'+(await Z[n].async('string')).replace(/<\/script/gi,'<\\/script')+'<\/script>':null});
await rep(/(src|poster)=["']([^"']+)["']/gi,async m=>{const d=await uri(find(norm(m[2])));return d?m[1]+'="'+d+'"':null});
return html}
async function loadDemo(pid){const p=projects().find(x=>x.id===pid),fr=$('#demo');if(!p?.hasFile||!fr)return;try{const d=await S.db.doc('files/'+p.owner.id+':'+pid).get();fr.srcdoc=d?.html||'<p style="font-family:sans-serif;padding:20px">Файл недоступен</p>'}catch(e){toast(e.message||'Ошибка',1)}}
const snap=r=>({docs:r.map(x=>({id:x.id,data:()=>x.data})),exists:r.length>0,data:()=>r[0]?.data});
const split=p=>{const a=p.split('/');return a[0]==='data'?['state',a[2]]:[a[0],a[1]]};
const LU=()=>{try{return JSON.parse(localStorage.getItem('df:users')||'{}')}catch{return{}}};
const hs=s=>{let h=5381;for(const c of s)h=(h*33^c.charCodeAt(0))>>>0;return h.toString(36)};
const LOCAL=()=>{const g=k=>{try{return JSON.parse(localStorage.getItem('df:'+k)||'{}')}catch{return{}}},subs=[],ping=c=>subs.filter(x=>x[0]===c).forEach(x=>x[1]());
return{local:true,collection:c=>({onSnapshot:cb=>{const f=()=>cb(snap(Object.entries(g(c)).map(([id,data])=>({id,data}))));subs.push([c,f]);f()}}),doc:p=>{const[c,id]=split(p);return{onSnapshot:cb=>{const f=()=>{const m=g(c);cb(snap(m[id]?[{id,data:m[id]}]:[]))};subs.push([c,f]);f()},get:async()=>g(c)[id]||null,del:async()=>{const m=g(c);delete m[id];localStorage.setItem('df:'+c,JSON.stringify(m));ping(c)},set:async d=>{const m=g(c);m[id]=d;localStorage.setItem('df:'+c,JSON.stringify(m));ping(c)}}}}};
const DB=(()=>{
const C=window.DEVFOLIO||{};
if(!(C.SUPABASE_URL&&C.SUPABASE_ANON_KEY&&window.supabase))return LOCAL();
const sb=supabase.createClient(C.SUPABASE_URL,C.SUPABASE_ANON_KEY);
const watch=(col,id,cb,eb)=>{const load=async()=>{let q=sb.from('docs').select('id,data').eq('col',col);if(id)q=q.eq('id',id);const{data,error}=await q;if(error)return eb&&eb(error);cb(snap(data))};load();sb.channel('w-'+col+(id||'')).on('postgres_changes',{event:'*',schema:'public',table:'docs',filter:'col=eq.'+col},load).subscribe()};
return{sb,collection:c=>({onSnapshot:(cb,eb)=>watch(c,null,cb,eb)}),doc:p=>{const[c,id]=split(p);return{onSnapshot:(cb,eb)=>watch(c,id,cb,eb),get:async()=>{const{data,error}=await sb.from('docs').select('data').eq('col',c).eq('id',id).maybeSingle();if(error)throw error;return data?.data||null},del:async()=>{const{error}=await sb.from('docs').delete().eq('col',c).eq('id',id);if(error)throw error},set:async d=>{const{error}=await sb.from('docs').upsert({col:c,id,data:d,updated_at:new Date().toISOString()});if(error)throw error}}}}
})();
const cred=()=>Object.fromEntries(new FormData($('#app form[data-f=auth]')));
F.auth=()=>A.signin();
A.signin=async()=>{const d=cred();if(DB.local){const u=LU()[(d.email||'').toLowerCase()];if(!u||u.h!==hs(d.password||''))return toast('Неверный email или пароль',1);localStorage.setItem('df:session',u.id);return location.reload()}const{error}=await DB.sb.auth.signInWithPassword({email:d.email,password:d.password});if(error)toast(error.message,1)};
A.signup=async()=>{const d=cred();if(!d.email||(d.password||'').length<6)return toast('Нужен email и пароль от 6 символов',1);if(DB.local){const us=LU(),k=d.email.toLowerCase();if(us[k])return toast('Этот email уже зарегистрирован',1);const id='u'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);us[k]={id,name:k.split('@')[0],h:hs(d.password)};localStorage.setItem('df:users',JSON.stringify(us));localStorage.setItem('df:session',id);return location.reload()}const{data,error}=await DB.sb.auth.signUp({email:d.email,password:d.password,options:{data:{name:d.email.split('@')[0]}}});if(error)return toast(error.message,1);if(!data.session)toast('Проверьте почту, чтобы подтвердить аккаунт')};
A.logout=async()=>{if(DB.local){localStorage.removeItem('df:session');return location.reload()}await DB.sb.auth.signOut()};
render();
(async()=>{
try{const w=window.Telegram?.WebApp;w?.ready();w?.expand()}catch{}
S.db=DB;
if(DB.local){const id=localStorage.getItem('df:session'),u=Object.values(LU()).find(x=>x.id===id);if(u)S.me={id:u.id,name:u.name};toast('Локальный режим: данные хранятся только в этом браузере.')}
else{const{data}=await DB.sb.auth.getSession(),u=data.session?.user;if(u)S.me={id:u.id,name:u.user_metadata?.name||(u.email||'').split('@')[0]||'Разработчик'};DB.sb.auth.onAuthStateChange(ev=>{if((ev==='SIGNED_IN'&&!S.me)||ev==='SIGNED_OUT')location.reload()})}
const t=setTimeout(()=>{S.loaded=true;render()},10000);
S.db.collection('profiles').onSnapshot(s=>{clearTimeout(t);S.profiles=s.docs.map(d=>({id:d.id,...d.data()}));S.loaded=true;render()},e=>{S.loaded=true;render();toast('Не удалось загрузить данные',1)});
S.db.collection('reviews').onSnapshot(s=>{S.rev={};s.docs.forEach(d=>S.rev[d.id]=d.data().items||{});render()},()=>{});
S.db.collection('msgs').onSnapshot(s=>{S.msgs={};s.docs.forEach(d=>{const a=d.id.split(':')[0];S.msgs[a]=[...(S.msgs[a]||[]),...(d.data().list||[])]});render()},()=>{});
if(S.me)S.db.doc('data/users/'+S.me.id+'/state').onSnapshot(s=>{S.st=s.exists?s.data():{};render()},()=>{});
S.db.collection('stars').onSnapshot(s=>{S.stars={};s.docs.forEach(d=>S.stars[d.id]=d.data().ids||[]);render()},()=>{});
})();
</script></body></html>
